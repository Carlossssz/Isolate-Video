<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Isolate — Player de vídeo</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="style.css?v=backup">
    <script src="script.js?v=protected-playlists" defer></script>
</head>
<body>
    <button id="library-toggle" class="icon-button" type="button" title="Abrir menu" aria-label="Abrir menu" aria-controls="library" aria-expanded="false"><span class="icon" aria-hidden="true">menu</span></button>
    <aside id="library" class="library" hidden aria-label="Biblioteca de vídeos">
        <div class="library-heading">
            <h2>Biblioteca</h2>
            <button id="library-close" class="icon-button" type="button" title="Fechar biblioteca" aria-label="Fechar biblioteca"><span class="icon" aria-hidden="true">close</span></button>
        </div>
        <div id="library-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Largura da biblioteca" aria-controls="library" aria-valuemin="230" aria-valuemax="660" aria-valuenow="288"></div>
        <nav class="library-tabs" aria-label="Seções do menu">
            <button id="videos-tab" class="button secondary" type="button" aria-controls="library-videos" aria-pressed="true">Vídeos</button>
            <button id="settings-tab" class="button secondary" type="button" aria-controls="settings" aria-pressed="false">Configurações</button>
        </nav>
        <div id="library-videos">
            <nav id="collections" aria-label="Coleções"></nav>
            <div class="folder-heading">
                <h3><button id="playlists-toggle" type="button" aria-controls="folders" aria-expanded="true"><span class="icon" aria-hidden="true">expand_more</span> Playlists</button></h3>
                <button id="new-folder" class="icon-button" type="button" title="Nova playlist" aria-label="Nova playlist"><span class="icon" aria-hidden="true">create_new_folder</span></button>
            </div>
            <nav id="folders" aria-label="Playlists"></nav>
            <section class="video-list" aria-labelledby="list-title">
                <div class="list-heading">
                    <h3 id="list-title">Histórico</h3>
                    <button id="add-playlist-video" class="button secondary" type="button" hidden>
                        <span class="icon" aria-hidden="true">video_call</span> Adicionar vídeo
                    </button>
                </div>
                <div id="entries"></div>
            </section>
        </div>
        <section id="settings" aria-label="Configurações" hidden>
            <label class="setting" for="theme-color">
                Cor do tema <input id="theme-color" type="color" value="#ff525d">
            </label>
            <label class="setting" for="opposite-colors">
                Cores opostas <input id="opposite-colors" type="checkbox">
            </label>
            <label class="setting" for="start-rate">
                Velocidade inicial
                <select id="start-rate">
                    <option value="0.25">0,25×</option>
                    <option value="0.5">0,5×</option>
                    <option value="0.75">0,75×</option>
                    <option value="1">1×</option>
                    <option value="1.25">1,25×</option>
                    <option value="1.5">1,5×</option>
                    <option value="1.75">1,75×</option>
                    <option value="2">2×</option>
                </select>
            </label>
            <label class="setting" for="shift-delete">
                Atalho Shift para excluir vídeos <input id="shift-delete" type="checkbox" checked>
            </label>
            <label class="setting" for="retro-sounds">
                Sons retrô <input id="retro-sounds" type="checkbox">
            </label>
            <section class="backup-settings" aria-labelledby="backup-title">
                <h3 id="backup-title">Backup</h3>
                <div class="backup-actions">
                    <button id="export-backup" class="button secondary" type="button"><span class="icon" aria-hidden="true">upload</span> Exportar tudo</button>
                    <button id="import-backup" class="button secondary" type="button"><span class="icon" aria-hidden="true">download</span> Importar backup</button>
                </div>
                <input id="backup-file" type="file" accept=".json,application/json" hidden>
                <p id="backup-status" role="status" hidden></p>
            </section>
        </section>
    </aside>
    <main>
        <div class="workspace">
            <form id="load-form">
                <label class="sr-only" for="video-link">Link ou ID do vídeo</label>
                <div class="link-field"><span class="icon" aria-hidden="true">link</span><input id="video-link" type="text" inputmode="url" autocomplete="off" placeholder="Cole um link ou ID do YouTube"></div>
                <button class="button primary" type="submit"><span class="icon" aria-hidden="true">play_arrow</span> Reproduzir</button>
            </form>
            <p id="status" role="status" hidden></p>
            <div id="player-dock">
                <section id="player-shell" class="player-shell" aria-label="Reprodutor">
                    <div class="player-toolbar">
                        <button id="drag-player" class="icon-button drag" type="button" aria-label="Mover player. Use as setas no teclado." title="Arraste para mover"><span class="icon" aria-hidden="true">drag_indicator</span></button>
                        <span id="now-playing">Reprodutor</span>
                        <div class="player-actions">
                            <button id="save-video" class="icon-button" type="button" title="Salvar vídeo" aria-label="Salvar vídeo" disabled><span class="icon" aria-hidden="true">bookmark_add</span></button>
                            <button id="watch-video" class="icon-button" type="button" title="Marcar como assistido" aria-label="Marcar como assistido" aria-pressed="false" disabled><span class="icon" aria-hidden="true">check_circle</span></button>
                            <button id="pip" class="icon-button" type="button" title="Janela flutuante (Picture-in-Picture)" aria-label="Janela flutuante" disabled><span class="icon" aria-hidden="true">picture_in_picture_alt</span></button>
                            <button id="fullscreen" class="icon-button" type="button" title="Tela cheia" aria-label="Tela cheia"><span class="icon" aria-hidden="true">fullscreen</span></button>
                            <button id="dock-player" class="icon-button" type="button" title="Voltar à posição inicial" aria-label="Voltar à posição inicial" hidden><span class="icon" aria-hidden="true">keyboard_return</span></button>
                        </div>
                    </div>
                    <div id="screen">
                        <div id="media"></div>
                        <div id="wake-player" aria-hidden="true"></div>
                        <div id="empty-player">
                            <div class="play-tile icon" aria-hidden="true">play_arrow</div>
                            <h2>Pronto para assistir?</h2>
                            <p>Cole um link do YouTube ou um link direto para um arquivo de vídeo.</p>
                        </div>
                        <div id="media-error" hidden>
                            <p id="media-error-text"></p>
                            <a id="open-source" target="_blank" rel="noopener noreferrer"><span id="open-source-label">Abrir na origem</span> <span class="icon" aria-hidden="true">open_in_new</span></a>
                        </div>
                    </div>
                    <button id="resize-player" class="icon-button resize" type="button" title="Arraste para redimensionar" aria-label="Redimensionar player. Use as setas no teclado."><span class="icon" aria-hidden="true">resize_bottom_right</span></button>
                </section>
            </div>
        </div>
    </main>
    <div id="video-title-tooltip" aria-hidden="true" hidden></div>
    <dialog id="editor" aria-labelledby="editor-title">
        <form id="editor-form">
            <h2 id="editor-title"></h2>
            <div id="editor-fields"></div>
            <p id="editor-error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button id="delete-item" class="button danger" type="button" hidden>Excluir</button>
                <button id="cancel-edit" class="button secondary" type="button">Cancelar</button>
                <button id="commit-edit" class="button primary" type="submit">Salvar</button>
            </div>
        </form>
    </dialog>
</body>
</html>
